name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10: обещанный минимум из README, 3.13: актуальный (ruff + mypy strict).
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Формат (ruff format)
        run: ruff format --check .

      - name: Линтер (ruff check)
        run: ruff check .

      - name: Типы (mypy strict)
        run: mypy .

      - name: Тесты (pytest)
        run: pytest -q

  shell:
    name: Скрипты установки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck и синтаксис
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          bash -n install.sh
          bash -n install/stacksentry-ctl
          bash -n install/stacksentry-menu
          bash -n install/stacksentry-doctor
          sh -n install/stacksentry-bot.init
          shellcheck install.sh install/stacksentry-ctl install/stacksentry-menu install/stacksentry-doctor

      - name: Синтаксис sudoers
        run: sudo visudo -cf install/stacksentry-sudoers

      - name: Sudoers, который генерирует установщик
        run: |
          # Проверяем именно сгенерированные правила (с реальными именами
          # юнитов и ключами), а не только статический пример.
          set -euo pipefail
          svc=stacksentry
          wrapper=/usr/local/bin/stacksentry-ctl
          units="x-ui fail2ban"
          keys="df_-h free_-h uptime"
          rules=""
          for unit in $units; do
            for sub in is_active restart_service journal journal_more journal_errors; do
              rules="$rules${rules:+, }$wrapper $sub $unit"
            done
          done
          for sub in apt_upgrade apt_upgrade_phased dist_upgrade reboot; do
            rules="$rules${rules:+, }$wrapper $sub"
          done
          for key in $keys; do
            rules="$rules${rules:+, }$wrapper run_command $key"
          done
          sudo sh -c "printf '%s ALL=(root) NOPASSWD: %s\n' '$svc' '$rules' > /etc/sudoers.d/ci-generated"
          sudo visudo -cf /etc/sudoers.d/ci-generated
          sudo rm -f /etc/sudoers.d/ci-generated

      - name: Адреса по умолчанию в установщике
        run: bash install.sh --print-source
