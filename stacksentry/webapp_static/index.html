<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1118">
  <title>StackSentry</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0b1118; color: #e9eff7; }
  </style>
  <link rel="stylesheet" href="/style.css?v=1.1.0">
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div class="brand-copy">
          <div class="brand">StackSentry</div>
          <div id="sub" class="status-line" role="status" aria-live="polite">
            <span class="status-dot warn"></span><span>Загрузка…</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button id="search" class="icon-button" type="button" aria-label="Поиск" title="Поиск">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path>
          </svg>
        </button>
        <button id="refresh" class="icon-button" type="button" aria-label="Обновить данные" title="Обновить">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11a8.1 8.1 0 0 0-15.5-4M4 5v4h4"></path>
            <path d="M4 13a8.1 8.1 0 0 0 15.5 4M20 19v-4h-4"></path>
          </svg>
        </button>
      </div>
    </div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Разделы"></nav>
    <div id="update-banner" class="update-banner" role="status" hidden></div>
  </header>

  <main id="main" class="main" aria-busy="true">
    <div id="view" class="view">
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
    </div>
    <section id="terminal-view" class="terminal-view" hidden></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Для StackSentry нужен JavaScript.</noscript>
  <script src="/app.js?v=1.1.0"></script>
</body>
</html>
